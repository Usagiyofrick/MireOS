exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = qs
exec-once = hyprpaper
source = $HOME/.config/hypr/monitors.conf
source = $HOME/.config/hypr/workspaces.conf
$mainMod = SUPER

bind = $mainMod, RETURN, exec, foot
bind = SUPER, D, global, quickshell:launcher
bind = $mainMod, Q, killactive

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

binde = SUPER CTRL, H, resizeactive, -30 0
binde = SUPER CTRL, L, resizeactive, 30 0
binde = SUPER CTRL, K, resizeactive, 0 -30
binde = SUPER CTRL, J, resizeactive, 0 30

bind = SUPER, F, fullscreen, 0
bind = SUPER, A, togglefloating

bind = SUPER ALT, H, moveactive, -10 0
bind = SUPER ALT, L, moveactive, 10 0
bind = SUPER ALT, K, moveactive, 0 -10
bind = SUPER ALT, J, moveactive, 0 10

bind = SUPER, C, centerwindow
bind = SUPER, E, exec, foot -e yazi
bind = SUPER, W, exec, firefox
bind = SUPER CTRL, Q, exec, hyprlock

bind = SUPER, equal, global, quickshell:volume-up
bind = SUPER, minus, global, quickshell:volume-down
bind = SUPER, M, global, quickshell:volume-mute

bind = , PRINT, exec, ~/.local/bin/sungan-screenshot full
bind = SUPER SHIFT, S, exec, ~/.local/bin/sungan-screenshot area
bind = SUPER SHIFT, Q, exec, ~/.local/bin/sungan-power

# ------------------------------------------------------------
# Sungan special workspaces
# ------------------------------------------------------------

# Generic scratchpad
bind = SUPER, X, movetoworkspacesilent, special:scratchpad
bind = SUPER, TAB, togglespecialworkspace, scratchpad

# Quick tools
bind = SUPER, B, exec, ~/.local/bin/sungan-btop
bind = SUPER, K, exec, ~/.local/bin/sungan-calc
bind = SUPER, N, exec, ~/.local/bin/sungan-notes

# ------------------------------------------------------------
# Workspace keycodes
# ------------------------------------------------------------

# Switch workspace
bind = SUPER, code:10, workspace, 1
bind = SUPER, code:11, workspace, 2
bind = SUPER, code:12, workspace, 3
bind = SUPER, code:13, workspace, 4
bind = SUPER, code:14, workspace, 5
bind = SUPER, code:15, workspace, 6
bind = SUPER, code:16, workspace, 7
bind = SUPER, code:17, workspace, 8
bind = SUPER, code:18, workspace, 9

# Move active window to workspace
bind = SUPER SHIFT, code:10, movetoworkspace, 1
bind = SUPER SHIFT, code:11, movetoworkspace, 2
bind = SUPER SHIFT, code:12, movetoworkspace, 3
bind = SUPER SHIFT, code:13, movetoworkspace, 4
bind = SUPER SHIFT, code:14, movetoworkspace, 5
bind = SUPER SHIFT, code:15, movetoworkspace, 6
bind = SUPER SHIFT, code:16, movetoworkspace, 7
bind = SUPER SHIFT, code:17, movetoworkspace, 8
bind = SUPER SHIFT, code:18, movetoworkspace, 9

# ------------------------------------------------------------
# Workspace animations
# ------------------------------------------------------------

animations {
    enabled = yes

    animation = workspaces, 1, 5, default, slidevert
}

# Lan Mouse
bind = SUPER, I, exec, ~/.local/bin/sungan-lan-mouse
